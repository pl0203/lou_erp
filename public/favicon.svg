<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" role="img" aria-labelledby="title desc">
<title id="title">Padiwan small favicon</title>
<desc id="desc">A continuous umbrella canopy above five rice grains, two on the left and three on the right, representing the five family members in the business.</desc>
<rect width="16" height="16" fill="#FFFFFF"/><path id="umbrella" fill="#192D43" d="M1 4.7 L8 1.5 L15 4.7 H8.5 V14.5 H7.5 V4.7 Z"/><g id="five-family-grains" fill="#192D43"><path id="grain-right-1" data-side="right" d="M10 7.2 C10 6.1 10.8 5.3 12 5.2 C12 6.4 11.2 7.2 10 7.2 Z"/><path id="grain-right-2" data-side="right" d="M10 7.2 C10 6.1 10.8 5.3 12 5.2 C12 6.4 11.2 7.2 10 7.2 Z" transform="translate(0,3)"/><path id="grain-right-3" data-side="right" d="M10 7.2 C10 6.1 10.8 5.3 12 5.2 C12 6.4 11.2 7.2 10 7.2 Z" transform="translate(0,6)"/><path id="grain-left-1" data-side="left" d="M10 7.2 C10 6.1 10.8 5.3 12 5.2 C12 6.4 11.2 7.2 10 7.2 Z" transform="translate(15.5,1.5) scale(-1,1)"/><path id="grain-left-2" data-side="left" d="M10 7.2 C10 6.1 10.8 5.3 12 5.2 C12 6.4 11.2 7.2 10 7.2 Z" transform="translate(15.5,4.5) scale(-1,1)"/></g>
</svg>
