name: Pilot safety checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: pilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: pilot_test
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: synthetic-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Install official PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Load only synthetic test contract and candidate migrations
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/database/fixture.sql
          for file in supabase/migrations/*.sql; do
            if [[ "$file" < supabase/migrations/202610010001_scalable_order_reads.sql ]]; then psql -X -v ON_ERROR_STOP=1 -f "$file"; fi
          done
          psql -X -v ON_ERROR_STOP=1 -f tests/database/hosted-read-policy-fixture.sql
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $red$ BEGIN
            BEGIN
              PERFORM public.pilot_po_page_v1('all','',1,10);
              RAISE EXCEPTION 'Order read unexpectedly exists before candidate migration';
            EXCEPTION WHEN undefined_function THEN
              RAISE NOTICE 'ORDER_READ_BASELINE_UNDEFINED_FUNCTION_VERIFIED';
            END;
            BEGIN
              PERFORM public.pilot_athel_summary_v1('2026-09-01','2026-09-30','2026-07-01','all','all');
              RAISE EXCEPTION 'Report read unexpectedly exists before candidate migration';
            EXCEPTION WHEN undefined_function THEN
              RAISE NOTICE 'REPORT_READ_BASELINE_UNDEFINED_FUNCTION_VERIFIED';
            END;
          END $red$;
          SQL
          for file in supabase/migrations/*.sql; do
            if [[ "$file" < supabase/migrations/202610010001_scalable_order_reads.sql ]]; then continue; fi
            if [[ "$file" == supabase/migrations/202610010007_read_policy_plans.sql ]]; then
              node tests/scalability/read-migration-guards.mjs
              psql -X -v ON_ERROR_STOP=1 -f scale-results/read-migration-guards.sql
            fi
            psql -X -v ON_ERROR_STOP=1 -f "$file"
          done
      - name: SQL invariants, real role permissions and Storage metadata policies
        run: |
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/security/explicit_guards.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/security/pilot_security.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/security/storage_helpers.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/tests/security/storage_rls.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/order-transactions.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/visit-transactions.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-policy-state.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-index.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-summary-parity.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-customer-parity.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-sales-page-parity.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-order-reads.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-report-boundaries.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/database/scalable-report-reads.sql
      - name: Concurrent business operations
        run: node tests/database/concurrency.mjs
