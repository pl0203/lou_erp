name: CO workspace runtime
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: co-workspace-runtime-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  workspace-sql:
    if: >-
      github.repository == 'pl0203/lou_erp' &&
      github.event.pull_request.head.repo.full_name == 'pl0203/lou_erp' &&
      github.event.pull_request.head.ref == 'test/co-workspace-runtime-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [import-manifest, import-posting, import-races, workspace-reads]
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: pilot_test
        ports: ['5432:5432']
        options: >-
          --memory=2g --cpus=2 --log-driver=none
          --health-cmd "pg_isready -U postgres -d pilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: synthetic-ci-only
      PGDATABASE: pilot_test
      PGTZ: UTC
      CO_CI_PROFILE: github-co-workspace-v1
      CO_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      npm_config_update_notifier: 'false'
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: synthetic-test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and publication safety
        run: node scripts/verify-co-public-ci.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Provision marker in fresh job service
        run: |
          set -euo pipefail
          psql -X --no-password -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE public.pilot_fixture_marker(purpose text PRIMARY KEY);
          INSERT INTO public.pilot_fixture_marker VALUES ('disposable-pilot-ci');
          SQL
      - name: Execute fixed rollback and real race case
        env:
          FIXED_CASE: ${{ matrix.case }}
        run: node scripts/test-co-workspace-db.mjs --case "$FIXED_CASE"
  native-runtime:
    if: >-
      github.repository == 'pl0203/lou_erp' &&
      github.event.pull_request.head.repo.full_name == 'pl0203/lou_erp' &&
      github.event.pull_request.head.ref == 'test/co-workspace-runtime-20261027'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CO_CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      npm_config_update_notifier: 'false'
      VITE_SUPABASE_URL: https://example.invalid
      VITE_SUPABASE_ANON_KEY: synthetic-test-key
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source and publication safety
        run: node scripts/verify-co-public-ci.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test -- --maxWorkers=1
      - run: npm run typecheck
      - run: npm run build
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.7
          cache: false
      - name: Native Deno Edge type graph
        run: >-
          deno check --config tests/co-deno/deno.json --cached-only --no-remote
          supabase/functions/co-evidence-upload/index.ts
          supabase/functions/co-evidence-download/index.ts
          tests/co-deno/evidence_test.ts
      - name: Native Deno synthetic byte and evidence guards
        run: deno test --config tests/co-deno/deno.json --cached-only --no-remote tests/co-deno/evidence_test.ts
      - name: Native Chrome synthetic CO component and worker acceptance
        env:
          CO_NATIVE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tests/co-browser/run.mjs
